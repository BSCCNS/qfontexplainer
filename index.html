<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Quantum Compass</title>
    <!-- Pinch-zoom stays available: blocking it is an accessibility failure on
         a public site. The kiosk suppresses zoom in JS instead, where it can be
         limited to the installation. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Quantum Compass — companion screen for the installation. Creative Intelligence Lab, Barcelona Supercomputing Center." />
    <!-- The cat, re-framed square from assets/cat.svg. Its black fill reads on
         a light tab strip and its white outline on a dark one, so one file
         covers both. -->
    <link rel="icon" href="assets/favicon.svg" />
    <!-- styles.css carries the kiosk layout; responsive.css adds the fluid
         one for every other display. Order matters: responsive.css undoes the
         fixed canvas, so it must come second. -->
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <!--
      Screens are built by js/app.js from js/content.js — there is no
      user-facing text in this file on purpose, so translation never means
      touching markup.

      Two layouts share this markup: the installation panel gets the fixed
      2227.5 x 3960 canvas scaled to fit, everything else reflows. app.js picks
      one and puts .layout-kiosk / .layout-fluid on <body>; add ?layout=kiosk
      or ?layout=fluid to force either.

      Loaded as classic scripts rather than ES modules so the page runs from
      file:// with no web server at all. See README.md.
    -->
    <div class="viewport">
      <div class="stage" id="stage"></div>
    </div>

    <script src="js/content.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
