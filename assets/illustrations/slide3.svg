<!-- qc:animation -->
<style>
@keyframes qc-wave {
  0%   { opacity:.20; transform:scale(1); }
  35%  { opacity:1; }
  100% { opacity:.20; transform:scale(1.085); }
}
[data-qc-wave]{animation:qc-wave 3.2s linear infinite;transform-box:view-box}
[data-qc-set="0"]{transform-origin:276.5px 795.8px}
[data-qc-set="0"][data-qc-wave="0"]{animation-delay:-3.20s}
[data-qc-set="0"][data-qc-wave="1"]{animation-delay:-2.40s}
[data-qc-set="0"][data-qc-wave="2"]{animation-delay:-1.60s}
[data-qc-set="0"][data-qc-wave="3"]{animation-delay:-0.80s}
[data-qc-set="1"]{transform-origin:576.9px 959.6px}
[data-qc-set="1"][data-qc-wave="0"]{animation-delay:-3.20s}
[data-qc-set="1"][data-qc-wave="1"]{animation-delay:-2.40s}
[data-qc-set="1"][data-qc-wave="2"]{animation-delay:-1.60s}
[data-qc-set="1"][data-qc-wave="3"]{animation-delay:-0.80s}
@media (prefers-reduced-motion: reduce){[data-qc-wave]{animation:none}}
</style>
<!-- /qc:animation -->
